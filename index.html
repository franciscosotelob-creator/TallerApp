<body class="antialiased font-black selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const firebaseConfig = {
            apiKey: "AIzaSyC6sa4vhxMC2yv2kO9PKhdXtBSV3BhFD6Q",
            authDomain: "sistema-de-presupuestos-fsb.firebaseapp.com",
            projectId: "sistema-de-presupuestos-fsb",
            storageBucket: "sistema-de-presupuestos-fsb.firebasestorage.app",
            messagingSenderId: "365707535637",
            appId: "1:365707535637:web:e28ab3901a5f194e4df51c"
        };

        const APP_ID = 'maestranza-oficial';
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useMemo, useEffect, useRef } = React;

        const formatMoneda = (val) => new Intl.NumberFormat('es-PY', { style: 'currency', currency: 'PYG', minimumFractionDigits: 0 }).format(val);

        const formatDots = (val) => {
            if (val === undefined || val === null || val === "") return "";
            const num = val.toString().replace(/\D/g, "");
            return num.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };

        const parseDots = (val) => {
            if (val === "" || val === null || val === undefined) return 0;
            return parseInt(val.toString().replace(/\./g, "")) || 0;
        };

        const NumericInput = ({ value, onChange, className, placeholder }) => {
            return (
                <input
                    type="text"
                    value={formatDots(value)}
                    placeholder={placeholder}
                    className={className}
                    onChange={(e) => onChange(parseDots(e.target.value))}
                />
            );
        };

        const AutoResizeTextarea = ({ value, onChange, onFocus, onBlur, placeholder, className, isTitle = false }) => {
            const areaRef = useRef(null);
            
            const handleChange = (e) => {
                onChange(e);
                if (areaRef.current) {
                    areaRef.current.style.height = 'auto';
                    areaRef.current.style.height = areaRef.current.scrollHeight + 'px';
                }
            };

            useEffect(() => {
                if (areaRef.current) {
                    areaRef.current.style.height = 'auto';
                    areaRef.current.style.height = areaRef.current.scrollHeight + 'px';
                }
            }, [value]);

            return (
                <div className="w-full">
                    <div className={`hidden print:block print-text text-left ${isTitle ? 'font-black uppercase text-[11px]' : 'font-medium italic text-[10px] text-slate-400'}`}>
                        {value || " "}
                    </div>
                    <textarea 
                        ref={areaRef} 
                        value={value || ""} 
                        onChange={handleChange} 
                        onFocus={onFocus}
                        onBlur={onBlur}
                        placeholder={placeholder}
                        spellCheck="true"
                        className={`${className} w-full block bg-transparent outline-none overflow-hidden print:hidden text-left`} 
                        rows="1" 
                    />
                </div>
            );
        };

        const SafeIcon = ({ name, size = 16, className = "" }) => {
            const Lib = window.lucide || {};
            const IconComp = Lib[name];
            if (!IconComp) return <span style={{ width: size, height: size }} className="inline-block"></span>;
            const iconSvg = IconComp.map(tag => {
                const [tagName, attributes] = tag;
                return React.createElement(tagName, attributes);
            });
            return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`${className} pointer-events-none`}>{iconSvg}</svg>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [status, setStatus] = useState("checking");
            const [loginEmail, setLoginEmail] = useState("");
            const [loginPassword, setLoginPassword] = useState("");
            const [loginError, setLoginError] = useState("");

            const [msg, setMsg] = useState(null);
            const [savedBudgets, setSavedBudgets] = useState([]);
            const [savedClients, setSavedClients] = useState([]);
            
            const [savedEmpresas, setSavedEmpresas] = useState([]);
            const [showEmpresaList, setShowEmpresaList] = useState(false);
            
            const [openFolders, setOpenFolders] = useState({});
            const [showSaveConfirmModal, setShowSaveConfirmModal] = useState(false);
            const [showClientList, setShowClientList] = useState(false);
            const [expandedCosts, setExpandedCosts] = useState({});

            const [vistaActiva, setVistaActiva] = useState('dashboard');
            const [savedRemisiones, setSavedRemisiones] = useState([]);
            const [openRemisionesFolders, setOpenRemisionesFolders] = useState({});

            const [savedAlmacen, setSavedAlmacen] = useState([]);
            const [filtroAlmacen, setFiltroAlmacen] = useState("");
            const [showInsumoModal, setShowInsumoModal] = useState(false);
            const [categoriaPersonalizada, setCategoriaPersonalizada] = useState("");
            const [insumoForm, setInsumoForm] = useState({
                id: null,
                codigo: "",
                descripcion: "",
                categoria: "Vigas Estructurales",
                unidad: "KG",
                cantidad: 0,
                stockMinimo: 100,
                costoUnitario: 0
            });

            const [empresa, setEmpresa] = useState({
                nombre: "METALCOM",
                ruc: "8008008-8",
                direccion: "LUQUE - PARAGUAY",
                telefono: "0981 000 000",
                email: "INFO@METALCOM.COM",
                logoUrl: ""
            });

            const [nroPresupuesto, setNroPresupuesto] = useState("");
            const [estado, setEstado] = useState("pendiente");
            const [facturaVinculada, setFacturaVinculada] = useState("");
            const [cliente, setCliente] = useState({ nombre: "", ruc: "", direccion: "", atencion: "", vendedor: "", telefono: "", email: "" });
            
            const [items, setItems] = useState([{ 
                id: Date.now(), 
                titulo: "", 
                detalles: "", 
                cantidad: 1, 
                precioUnitario: 0,
                pesoKg: 0,
                precioKg: 0,
                insumos: 0,
                diasTrabajados: 0,
                costoDia: 250000, 
                margenDeseado: 30 
            }]);

            const [condiciones, setCondiciones] = useState("Plazo de entrega: A convenir.\nForma de pago: 60% entrega inicial y saldo contra entrega.");

            const [pagos, setPagos] = useState([]);
            const [nuevoPago, setNuevoServicioPago] = useState({ monto: 0, concepto: "ANTICIPO 60%", metodo: "TRANSFERENCIA", comprobante: "" });
            const [reciboParaImprimir, setReciboParaImprimir] = useState(null);

            const [serviciosPredeterminados, setServiciosPredeterminados] = useState([]);
            const [nuevoServicioNombre, setNuevoServicioNombre] = useState("");
            const [showServiceList, setShowServiceList] = useState({});

            const [nroRemision, setNroRemision] = useState("");
            const [alertaSinAnticipo, setAlertaSinAnticipo] = useState(false);
            const [remisionDatos, setRemisionDatos] = useState({
                fechaEmision: new Date().toISOString().split('T')[0],
                fechaTraslado: new Date().toISOString().split('T')[0],
                comprobanteVenta: "", 
                facturaManual: "",     
                motivoTraslado: "VENTA",
                conductorNombre: "",
                conductorRuc: "",
                vehiculoChapa: "",
                marcaVehiculo: "",
                puntoPartida: "LUQUE - PARAGUAY",
                puntoLlegada: ""
            });
            const [remisionItems, setRemisionItems] = useState([{
                id: Date.now(),
                descripcion: "",
                cantidad: 1,
                indigoMedida: "UNIDAD",
                pesoTotalKg: 0
            }]);

            const showMsg = (text) => { setMsg(text); setTimeout(() => setMsg(null), 5000); };

            const generarNro = (lista) => {
                const year = new Date().getFullYear();
                const prefix = `PR-${year}.`;
                const filtrados = lista.filter(b => b.nroPresupuesto?.startsWith(prefix));
                let maxNum = 0;
                filtrados.forEach(b => {
                    const parts = b.nroPresupuesto.split('.');
                    if (parts.length > 1) {
                        const num = parseInt(parts[1]);
                        if (!isNaN(num) && num > maxNum) maxNum = num;
                    }
                });
                return `${prefix}${(maxNum + 1).toString().padStart(4, '0')}`;
            };

            const generarNroRemision = (lista) => {
                const prefix = "001-001-";
                let maxNum = 0;
                lista.forEach(r => {
                    if (r.nroRemision?.startsWith(prefix)) {
                        const numStr = r.nroRemision.replace(prefix, "");
                        const num = parseInt(numStr);
                        if (!isNaN(num) && num > maxNum) maxNum = num;
                    }
                });
                return `${prefix}${(maxNum + 1).toString().padStart(7, '0')}`;
            };

            const generarSiguienteFactura = (listaPresupuestos, listaRemisiones) => {
                let maxNum = 0;
                let prefijoUsado = "001-002-";

                listaPresupuestos.forEach(b => {
                    if (b.facturaVinculada && b.facturaVinculada.includes('-')) {
                        const partes = b.facturaVinculada.split('-');
                        if (partes.length === 3) {
                            prefijoUsado = `${partes[0]}-${partes[1]}-`;
                            const num = parseInt(partes[2]);
                            if (!isNaN(num) && num > maxNum) maxNum = num;
                        }
                    }
                });

                listaRemisiones.forEach(r => {
                    if (r.remisionDatos?.facturaManual && r.remisionDatos.facturaManual.includes('-')) {
                        const partes = r.remisionDatos.facturaManual.split('-');
                        if (partes.length === 3) {
                            prefijoUsado = `${partes[0]}-${partes[1]}-`;
                            const num = parseInt(partes[2]);
                            if (!isNaN(num) && num > maxNum) maxNum = num;
                        }
                    }
                });

                if (maxNum === 0) return `${prefijoUsado}0000001`;
                return `${prefijoUsado}${(maxNum + 1).toString().padStart(7, '0')}`;
            };

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged((firebaseUser) => {
                    if (firebaseUser) {
                        setUser(firebaseUser);
                        setStatus("online");
                    } else {
                        setUser(null);
                        setStatus("offline");
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;

                const unsubAlmacen = db.collection(`artifacts/${APP_ID}/public/data/almacen`).onSnapshot(snap => {
                    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSavedAlmacen(docs.sort((a,b) => (a.codigo || "").localeCompare(b.codigo || "")));
                });

                const unsubCatalogo = db.collection('artifacts').doc(APP_ID).collection('public').doc('catalogo_servicios').onSnapshot(doc => {
                    if (doc.exists && doc.data().lista) {
                        setServiciosPredeterminados(doc.data().lista);
                    } else {
                        setServiciosPredeterminados([
                            "SERVICIO DE CORTE Y DOBLADO DE CHAPAS",
                            "FABRICACIÓN DE ESTRUCTURA METÁLICA",
                            "MONTAJE EN CAMPO Y INSTALACIÓN",
                            "CONSULTA Y TRATAMIENTO PROFESIONAL",
                            "MANTENIMIENTO Y SERVICIO TÉCNICO"
                        ]);
                    }
                });
                
                const unsubConfig = db.collection('artifacts').doc(APP_ID).collection('public').doc('config_empresa').onSnapshot(doc => {
                    if (doc.exists) {
                        const d = doc.data();
                        setEmpresa(prev => ({
                            nombre: d.nombre || prev.nombre,
                            ruc: d.ruc || prev.ruc,
                            direccion: d.direccion || prev.direccion,
                            telefono: d.telefono || prev.telefono,
                            email: d.email || prev.email,
                            logoUrl: d.logoUrl || ""
                        }));
                    }
                });

                const path = `artifacts/${APP_ID}/public/data/presupuestos`;
                const unsub = db.collection(path).onSnapshot(snap => {
                    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSavedBudgets(docs.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)));
                }, () => setStatus("offline"));

                const unsubC = db.collection(`artifacts/${APP_ID}/public/data/clientes`).onSnapshot(snap => {
                    setSavedClients(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const unsubR = db.collection(`artifacts/${APP_ID}/public/data/remisiones`).onSnapshot(snap => {
                    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSavedRemisiones(docs.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)));
                });

                const unsubE = db.collection(`artifacts/${APP_ID}/public/data/empresas`).onSnapshot(snap => {
                    setSavedEmpresas(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => { unsubAlmacen(); unsubCatalogo(); unsubConfig(); unsub(); unsubC(); unsubR(); unsubE(); };
            }, [user]);

            useEffect(() => {
                if (savedBudgets.length > 0 && !nroPresupuesto) {
                    setNroPresupuesto(generarNro(savedBudgets));
                }
            }, [savedBudgets]);

            useEffect(() => {
                if (savedRemisiones.length > 0 && !nroRemision) {
                    setNroRemision(generarNroRemision(savedRemisiones));
                }
            }, [savedRemisiones]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError("");
                try {
                    const cred = await auth.signInWithEmailAndPassword(loginEmail, loginPassword);
                    setUser(cred.user);
                    setStatus("online");
                    showMsg("🔓 Sesión Iniciada");
                } catch (err) {
                    setLoginError("Acceso denegado. Revisa tu configuración en Firebase.");
                }
            };

            const handleLogout = async () => {
                try {
                    await auth.signOut();
                } catch (err) {
                    console.error("Error al cerrar sesión:", err);
                } finally {
                    setUser(null);
                    setStatus("offline");
                    window.location.reload(); 
                }
            };

            const guardarInsumo = async (e) => {
                e.preventDefault();
                if (!insumoForm.descripcion.trim()) return;

                const categoriaFinal = insumoForm.categoria === "OTRA" 
                    ? (categoriaPersonalizada.toUpperCase().trim() || "GENERAL") 
                    : insumoForm.categoria;

                const docId = insumoForm.id || (insumoForm.codigo ? insumoForm.codigo.toLowerCase().replace(/\s+/g, '-') : `mat-${Date.now()}`);
                const autoCodigo = insumoForm.codigo ? insumoForm.codigo.toUpperCase() : `MAT-${(savedAlmacen.length + 1).toString().padStart(3, '0')}`;
                
                try {
                    await db.doc(`artifacts/${APP_ID}/public/data/almacen/${docId}`).set({
                        ...insumoForm,
                        id: docId,
                        codigo: autoCodigo,
                        descripcion: insumoForm.descripcion.toUpperCase(),
                        categoria: categoriaFinal,
                        cantidad: Number(insumoForm.cantidad) || 0,
                        stockMinimo: Number(insumoForm.stockMinimo) || 0,
                        costoUnitario: Number(insumoForm.costoUnitario) || 0,
                        updatedAt: Date.now()
                    });
                    showMsg("📦 Material Guardado en Almacén");
                    setShowInsumoModal(false);
                    setCategoriaPersonalizada("");
                    setInsumoForm({ id: null, codigo: "", descripcion: "", categoria: "Vigas Estructurales", unidad: "KG", cantidad: 0, stockMinimo: 100, costoUnitario: 0 });
                } catch (err) { showMsg("❌ Error al guardar en almacén"); }
            };

            const eliminarInsumo = async (insumoId) => {
                try {
                    await db.doc(`artifacts/${APP_ID}/public/data/almacen/${insumoId}`).delete();
                    showMsg("🗑️ Material Eliminado");
                } catch (err) { showMsg("❌ Error al eliminar"); }
            };

            const abrirEditarInsumo = (itemIns) => {
                setInsumoForm(itemIns);
                setShowInsumoModal(true);
            };

            const almacenFiltrado = useMemo(() => {
                if (!filtroAlmacen.trim()) return savedAlmacen;
                const f = filtroAlmacen.toLowerCase();
                return savedAlmacen.filter(a => 
                    (a.codigo && a.codigo.toLowerCase().includes(f)) ||
                    (a.descripcion && a.descripcion.toLowerCase().includes(f)) ||
                    (a.categoria && a.categoria.toLowerCase().includes(f))
                );
            }, [savedAlmacen, filtroAlmacen]);

            const resumenAlmacen = useMemo(() => {
                let totalKgPerfiles = 0;
                let totalKgChapas = 0;
                let totalConsumibles = 0;
                let insumosCriticos = 0;

                savedAlmacen.forEach(a => {
                    const cant = Number(a.cantidad) || 0;
                    const min = Number(a.stockMinimo) || 0;
                    if (cant <= min) insumosCriticos++;

                    if (a.categoria === 'Vigas Estructurales') totalKgPerfiles += cant;
                    else if (a.categoria === 'Laminados en Caliente') totalKgChapas += cant;
                    else totalConsumibles += cant;
                });

                return { totalKgPerfiles, totalKgChapas, totalConsumibles, insumosCriticos };
            }, [savedAlmacen]);

            const actualizarObraEtapa = async (presuId, nuevaEtapa) => {
                try {
                    await db.doc(`artifacts/${APP_ID}/public/data/presupuestos/${presuId}`).update({
                        etapaObra: nuevaEtapa,
                        updatedAt: Date.now()
                    });

            };

            const actualizarObraAvance = async (presuId, nuevoAvance) => {

                    await db.doc(`artifacts/${APP_ID}/public/data/presupuestos/${presuId}`).update({

                        updatedAt: Date.now()
                    });

            };

            const agregarAlCatalogo = async () => {
                if (!nuevoServicioNombre.trim()) return;
                const nuevaLista = [...serviciosPredeterminados, nuevoServicioNombre.toUpperCase().trim()];
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('catalogo_servicios').set({ lista: nuevaLista });

            };

            const eliminarDelCatalogo = async (itemABorrar) => {
                const nuevaLista = serviciosPredeterminados.filter(s => s !== itemABorrar);
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('catalogo_servicios').set({ lista: nuevaLista });
                    showMsg("🗑️ Ítem eliminado del Catálogo");

            const guardandoConfigEmpresa = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('config_empresa').set(empresa);

            const suggestedClients = useMemo(() => {
                if (!cliente.nombre || cliente.nombre.length < 1) return [];
                return savedClients.filter(c => c.nombre.toLowerCase().includes(cliente.nombre.toLowerCase())).slice(0, 5);
            }, [cliente.nombre, savedClients]);
            
            const suggestedEmpresas = useMemo(() => {
                if (!empresa.nombre || empresa.nombre.length < 1) return savedEmpresas;
                return savedEmpresas.filter(e => e.nombre?.toLowerCase().includes(empresa.nombre.toLowerCase()));
            }, [empresa.nombre, savedEmpresas]);

            const groupedBudgetsByEmpresa = useMemo(() => {
                return savedBudgets.reduce((acc, b) => {
                    const empNombre = b.empresa?.nombre || "EMPRESA SIN ESPECIFICAR";
                    const clientNombre = b.cliente?.nombre || "CLIENTE SIN NOMBRE";
                    if (!acc[empNombre]) acc[empNombre] = {};
                    if (!acc[empNombre][clientNombre]) acc[empNombre][clientNombre] = [];
                    acc[empNombre][clientNombre].push(b);
                    return acc;
                }, {});
            }, [savedBudgets]);

            const groupedRemisiones = useMemo(() => {
                return savedRemisiones.reduce((acc, r) => {
                    const folder = r.cliente?.nombre || "Sin Nombre";
                    if (!acc[folder]) acc[folder] = [];
                    acc[folder].push(r);
                    return acc;
                }, {});
            }, [savedRemisiones]);

            const obrasAprobadas = useMemo(() => {
                return savedBudgets.filter(b => b.estado === 'aprobado');
            }, [savedBudgets]);

            const totales = useMemo(() => {
                let totalVenta = 0;
                let totalCostoReal = 0;

                items.forEach(item => {
                    const cant = Number(item.cantidad) || 0;
                    totalVenta += cant * (Number(item.precioUnitario) || 0);
                    
                    const costoMat = (Number(item.pesoKg) || 0) * (Number(item.precioKg) || 0);
                    const costoMO = (Number(item.diasTrabajados) || 0) * (Number(item.costoDia) || 0);
                    const costoItem = costoMat + costoMO + (Number(item.insumos) || 0);
                    totalCostoReal += cant * costoItem;
                });

                const neto = Math.round(totalVenta / 1.1);
                const iva = totalVenta - neto;

                const totalCobrado = pagos.reduce((sum, p) => sum + (Number(p.monto) || 0), 0);
                const saldoPendiente = Math.max(0, totalVenta - totalCobrado);

                return { neto, iva, total: totalVenta, costoTotal: totalCostoReal, totalCobrado, saldoPendiente, margenActual: totalVenta > 0 ? ((totalVenta - totalCostoReal) / totalVenta) * 100 : 0 };
            }, [items, pagos]);

            const metricasDashboard = useMemo(() => {
                let aprobados = 0;
                let pendientes = 0;
                let rechazados = 0;
                let dineroTotal = 0;
                let cuentasPorCobrar = 0;

                savedBudgets.forEach(b => {
                    const t = Number(b.total) || 0;
                    dineroTotal += t;
                    if (b.estado === 'aprobado') {
                        aprobados++;
                        const cobrado = (b.pagos || []).reduce((sum, p) => sum + (Number(p.monto) || 0), 0);
                        cuentasPorCobrar += Math.max(0, t - cobrado);
                    }
                    else if (b.estado === 'rechazado') rechazados++;
                    else pendientes++;
                });

                const efectividad = savedBudgets.length > 0 ? (aprobados / savedBudgets.length) * 100 : 0;

                return { aprobados, pendientes, rechazados, totalProyectos: savedBudgets.length, dineroTotal, cuentasPorCobrar, efectividad, totalRemisiones: savedRemisiones.length };
            }, [savedBudgets, savedRemisiones]);

                }));

                const totalPagado = (presu.pagos || []).reduce((sum, p) => sum + (Number(p.monto) || 0), 0);
                if (totalPagado === 0) setAlertaSinAnticipo(true);
                else setAlertaSinAnticipo(false);

                const remisionesPrevias = savedRemisiones.filter(r => 
                    r.remisionDatos?.comprobanteVenta?.trim().toLowerCase() === presu.nroPresupuesto.trim().toLowerCase()
                );

                const despachadoPrevio = {};
                remisionesPrevias.forEach(r => {
                    (r.items || []).forEach(itRem => {
                        const clave = itRem.descripcion?.trim().toLowerCase();
                        if (clave) {
                            despachadoPrevio[clave] = (despachadoPrevio[clave] || 0) + (Number(itRem.cantidad) || 0);

                const nuevosItems = [];

                    const descComp = `${it.titulo} - ${it.detalles}`.substring(0, 100).trim();
                    const yaEntregado = despachadoPrevio[descComp.toLowerCase()] || 0;
                    const pendiente = Math.max(0, it.cantidad - yaEntregado);

                    if (pendiente > 0) {

                            cantidad: pendiente,

                        });
                    }

                    }));
                    showMsg("⚡ Datos estirados desde Factura Manual " + val);
                }
            };

            const actualizarItem = (id, campo, valor) => {
                setItems(prevItems => prevItems.map(item => {
                    if (item.id === id) {
                        const updated = { ...item, [campo]: valor };
                        
                        const peso = campo === 'pesoKg' ? Number(valor) : (Number(updated.pesoKg) || 0);
                        const precioKg = campo === 'precioKg' ? Number(valor) : (Number(updated.precioKg) || 0);

                        const dias = campo === 'diasTrabajados' ? Number(valor) : (Number(updated.diasTrabajados) || 0);
                        const costoDia = campo === 'costoDia' ? Number(valor) : (Number(updated.costoDia) || 0);
                        const margen = campo === 'margenDeseado' ? Number(valor) : (Number(updated.margenDeseado) || 30);

                        const costoUnitarioDirecto = (peso * precioKg) + (dias * costoDia) + insumos;
                        
                        if (['pesoKg', 'precioKg', 'insumos', 'diasTrabajados', 'costoDia', 'margenDeseado'].includes(campo)) {
                            updated.precioUnitario = Math.round(costoUnitarioDirecto / (1 - (margen / 100)));
                        }
                        
                        return updated;
                    }
                    return item;
                }));
            };

                                    <input type="password" required className="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-cyan-500 font-mono text-slate-200" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="••••••••"/>
                                </div>

                            </form>

                    <nav className="w-full sticky top-0 z-50 bg-[#1e293b] border-b border-slate-700 px-4 py-2 no-print flex flex-col lg:flex-row items-center justify-between gap-2 shadow-[0_4px_20px_rgba(0,0,0,0.15)] font-black">
                        <div className="flex items-center gap-4 w-full lg:w-auto justify-between lg:justify-start">

                    {/* MODAL DE ADVERTENCIA SOBREESCRITURA */}
                    {showSaveConfirmModal && (
                        <div className="fixed inset-0 z-[110] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 no-print font-black">
                            <div className="bg-[#1e293b] p-8 rounded-[2.5rem] border-2 border-slate-600 shadow-2xl max-w-md w-full text-center space-y-6">
                                <div className="w-16 h-16 bg-amber-950/40 border border-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto shadow-[0_0_15px_rgba(245,158,11,0.1)]"><SafeIcon name="AlertCircle" size={32}/></div>
                                <div><h3 className="font-black text-white uppercase text-sm tracking-widest font-mono">REGISTRO_YA_EXISTENTE</h3><p className="text-[10px] text-slate-400 font-bold mt-2 uppercase font-mono leading-relaxed">¿Deseas sobreescribir y actualizar el presupuesto {nroPresupuesto} o guardar como una nueva copia secuencial?</p></div>
                                <div className="grid grid-cols-1 gap-3 font-black font-mono">
                                    <button onClick={() => executeSave(nroPresupuesto)} className="py-4 bg-cyan-600 text-white rounded-xl text-[10px] font-black uppercase tracking-wider">SOBREESCRIBIR_REGISTRO</button>
                                    <button onClick={() => executeSave(generarNro(savedBudgets))} className="py-4 bg-slate-800 border border-slate-700 text-white rounded-xl text-[10px] font-black uppercase tracking-wider">GENERAR_NUEVA_COPIA</button>
                                    <button onClick={() => setShowSaveConfirmModal(false)} className="py-2 text-[10px] font-black text-slate-400 tracking-widest">ABORTAR_OPERACIÓN</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
